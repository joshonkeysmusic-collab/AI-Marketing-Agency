<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .page { height: 1080px; justify-content: center; padding: 96px 90px; }
  .q { font-family: var(--display); font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -0.035em; }
  .bars { display: grid; gap: 18px; margin-top: 64px; }
  .bar { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 22px; font-size: 26px; font-weight: 600; }
  .bar i { display: block; height: 22px; border-radius: 11px; }
  .chips { display: flex; gap: 16px; margin-top: 64px; flex-wrap: wrap; }
  .chips span { border: 2.5px solid; border-radius: 999px; padding: 14px 28px; font-size: 28px; font-weight: 700; }
  .foot { bottom: 56px; }
</style></head><body><div class="page">
  <p class="q">Automate the <span class="c-auto">admin.</span><br>Assist the <span class="c-assist">thinking.</span><br>Keep the <span class="c-human">judgement</span> human.</p>
  <div class="chips">
    <span style="border-color:var(--auto)" class="c-auto">Automate</span>
    <span style="border-color:var(--assist)" class="c-assist">Assist</span>
    <span style="border-color:var(--human)" class="c-human">Keep human</span>
  </div>
  <div class="foot"><span><b>Josh Forkwa</b> · AI Automation Specialist</span><span>AI in the workplace</span></div>
</div></body></html>
