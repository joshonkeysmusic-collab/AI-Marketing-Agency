<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Githaf Virtual Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B0F14;--surface:#141B24;--raise:#1B2531;--border:#243040;--text:#F2F5F8;--muted:#8A97A6;--green:#19E6A1;--hot:#FF7A59;--on-green:#06140F}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#EEF1F5;--surface:#fff;--raise:#F4F6F9;--border:#D5DDE7;--text:#0B0F14;--muted:#5B6875;--green:#0C9F70;--hot:#D9542F;--on-green:#fff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.5 'Plus Jakarta Sans','Segoe UI',sans-serif;padding:16px}
.card{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font:800 26px/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}p{margin:0;color:var(--muted)}
label{font:500 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;color:var(--text);background:var(--raise);border:1px solid var(--border);border-radius:12px;padding:12px 14px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;background:var(--green);color:var(--on-green);cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--hot);font-size:13px;min-height:1.2em}
a{color:var(--green);font-weight:600;text-decoration:none}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--green),#6FA0FF);display:grid;place-items:center;font:800 18px 'Bricolage Grotesque',sans-serif;color:var(--on-green)}
</style></head><body>
<form class="card" id="f">
  <div class="logo">G</div>
  <div><h1>Githaf Virtual Room</h1><p>Sign in with your workspace token. It was shown once when your workspace was created.</p></div>
  <div><label for="token">Workspace token</label><input id="token" type="password" autocomplete="current-password" required autofocus></div>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Open my room</button>
  <p>New here? <a href="/onboard">Start at the front desk →</a></p>
</form>
<script>
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
const next=new URLSearchParams(location.search).get('next')||'/room';
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';go.disabled=true;
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:document.getElementById('token').value})});
    const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Sign-in failed');location.href=next.startsWith('/')?next:'/room';}
  catch(x){err.textContent=x.message;go.disabled=false;}});
</script></body></html>
